<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missing Lemma Annotation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Missing lemma annotation</h1>
  <div class="progress" id="progress"></div>
  <button id="next-todo" title="Next lemma without an annotation (N)">Next unannotated →</button>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-tools">
      <input id="lemma-search" type="search" placeholder="Find lemma (accents optional)…" aria-label="Find lemma">
      <select id="lemma-filter" aria-label="Show">
        <option value="all">all lemmas</option>
        <option value="open">not annotated</option>
        <option value="flagged">flagged, not annotated</option>
        <option value="near">near LiGre match</option>
        <option value="translated">in a translated text (Ⓣ)</option>
        <option value="unsure">unsure</option>
        <option value="notaword">not a word</option>
        <option value="done">annotated</option>
      </select>
      <div class="sidebar-count" id="sidebar-count"></div>
    </div>
    <ol id="lemma-list" class="lemma-list"></ol>
  </aside>
  <main class="document" id="document">
    <p class="empty">Loading…</p>
  </main>
  <section class="panel" id="panel" aria-label="Annotation"></section>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
