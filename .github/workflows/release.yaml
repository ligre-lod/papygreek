name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the release metadata matches the tag
        run: python3 scripts/generate_release.py check "$GITHUB_REF_NAME" > notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "PapyGreek–LiGre ${GITHUB_REF_NAME#v}" --notes-file notes.md
